name: The Connect AI Desk Auto Draft

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/routes/api/desk-auto-draft.ts"
      - ".github/workflows/desk-auto-draft.yml"
  schedule:
    # Every 30 minutes. One AI worker keeps the free-tier pilot gentle on quota.
    - cron: "7,37 * * * *"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ingest RSS sources
        env:
          DESK_CRON_SECRET: ${{ secrets.DESK_CRON_SECRET || secrets.CRON_SECRET }}
          DESK_URL: https://www.theconnectbd.com/api/desk-auto-draft
        run: |
          set -euo pipefail

          if [ -z "${DESK_CRON_SECRET:-}" ]; then
            echo "Missing GitHub repository secret: DESK_CRON_SECRET"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --max-time 120 \
            -H "Authorization: Bearer ${DESK_CRON_SECRET}" \
            "${DESK_URL}?mode=ingest"

  workers:
    needs: ingest
    if: ${{ always() && needs.ingest.result != 'cancelled' }}
    strategy:
      fail-fast: false
      matrix:
        worker: [1]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Process one AI Desk story
        env:
          DESK_CRON_SECRET: ${{ secrets.DESK_CRON_SECRET || secrets.CRON_SECRET }}
          DESK_URL: https://www.theconnectbd.com/api/desk-auto-draft
          WORKER_ID: ${{ matrix.worker }}
        run: |
          set -euo pipefail

          if [ -z "${DESK_CRON_SECRET:-}" ]; then
            echo "Missing GitHub repository secret: DESK_CRON_SECRET"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --max-time 300 \
            -H "Authorization: Bearer ${DESK_CRON_SECRET}" \
            "${DESK_URL}?mode=worker&limit=1&worker=${WORKER_ID}"
